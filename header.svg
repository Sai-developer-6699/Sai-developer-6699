<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes line-glow {
      0%, 100% { stroke-opacity: 0.15; }
      50% { stroke-opacity: 0.55; }
    }
    @keyframes gradient-shift {
      0% { stop-color: #a78bfa; }
      50% { stop-color: #22d3ee; }
      100% { stop-color: #a78bfa; }
    }
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(258px); opacity: 0; }
    }
    .node-pulse-1 { animation: pulse 4s infinite ease-in-out; transform-origin: 150px 90px; }
    .node-pulse-2 { animation: pulse 3s infinite ease-in-out; transform-origin: 200px 210px; }
    .node-pulse-3 { animation: pulse 5s infinite ease-in-out; transform-origin: 700px 90px; }
    .node-pulse-4 { animation: pulse 3.5s infinite ease-in-out; transform-origin: 650px 210px; }
    .line-anim { animation: line-glow 4s infinite ease-in-out; }
    .grid-anim { animation: grid-pulse 6s infinite ease-in-out; }
    .scan-line { animation: scan 6s infinite linear; }
    .grad-stop-1 { animation: gradient-shift 6s infinite ease-in-out; }
    .grad-stop-2 { animation: gradient-shift 6s infinite ease-in-out; animation-delay: -3s; }
  </style>
  
  <!-- Background -->
  <rect width="850" height="260" rx="12" fill="#09090b" />
  
  <!-- Glowing Gradients -->
  <defs>
    <linearGradient id="animated-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="grad-stop-1" stop-color="#a78bfa" />
      <stop offset="100%" class="grad-stop-2" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <!-- Pattern for grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Glow Background -->
  <circle cx="425" cy="130" r="300" fill="url(#glow)" />

  <!-- Grid Overlay -->
  <rect class="grid-anim" width="850" height="260" rx="12" fill="url(#grid)" />

  <!-- Animated Scanline Effect -->
  <g class="scan-line" opacity="0.4">
    <rect x="0" y="0" width="850" height="2.5" fill="url(#animated-grad)" />
  </g>

  <!-- Abstract Tech Accents (Neural Network Nodes/Lines) -->
  <g stroke="#4f46e5" stroke-width="0.75" class="line-anim">
    <!-- Lines connecting nodes (Left Side) -->
    <line x1="80" y1="50" x2="150" y2="90" />
    <line x1="150" y1="90" x2="120" y2="180" />
    <line x1="120" y1="180" x2="200" y2="210" />
    <line x1="150" y1="90" x2="250" y2="70" />
    
    <!-- Lines connecting nodes (Right Side) -->
    <line x1="770" y1="50" x2="700" y2="90" />
    <line x1="700" y1="90" x2="730" y2="180" />
    <line x1="730" y1="180" x2="650" y2="210" />
    <line x1="700" y1="90" x2="600" y2="70" />
  </g>
  
  <g fill="#9ca3af" opacity="0.6">
    <!-- Left Nodes -->
    <circle cx="80" cy="50" r="3" />
    <circle class="node-pulse-1" cx="150" cy="90" r="5" fill="#a78bfa" />
    <circle cx="120" cy="180" r="3" />
    <circle class="node-pulse-2" cx="200" cy="210" r="5" fill="#22d3ee" />
    <circle cx="250" cy="70" r="3.5" />
    
    <!-- Right Nodes -->
    <circle cx="770" cy="50" r="3" />
    <circle class="node-pulse-3" cx="700" cy="90" r="5" fill="#22d3ee" />
    <circle cx="730" cy="180" r="3" />
    <circle class="node-pulse-4" cx="650" cy="210" r="5" fill="#a78bfa" />
    <circle cx="600" cy="70" r="3.5" />
  </g>

  <!-- Stylized Content -->
  <!-- Name -->
  <text x="425" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    SAI CHERANJEEVE S
  </text>
  
  <!-- Role / Subtitle -->
  <text x="425" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="url(#animated-grad)" letter-spacing="4">
    BACKEND ENGINEER • AI/ML SYSTEMS
  </text>

  <!-- Punchy Slogan -->
  <text x="425" y="185" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#9ca3af" letter-spacing="0.5">
    &lt; designing fault-tolerant, scale-ready systems /&gt;
  </text>

  <!-- Glowing Border Accent -->
  <rect x="0.5" y="0.5" width="849" height="259" rx="11.5" fill="none" stroke="#27272a" stroke-width="1.5" />
</svg>
