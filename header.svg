<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="260" rx="12" fill="#09090b" />
  
  <!-- Glowing Gradients -->
  <defs>
    <linearGradient id="violet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <!-- Pattern for grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Glow Background -->
  <circle cx="425" cy="130" r="300" fill="url(#glow)" />

  <!-- Grid Overlay -->
  <rect width="850" height="260" rx="12" fill="url(#grid)" />

  <!-- Abstract Tech Accents (Neural Network Nodes/Lines) -->
  <g stroke="#374151" stroke-width="0.75" opacity="0.4">
    <!-- Lines connecting nodes (Left Side) -->
    <line x1="80" y1="50" x2="150" y2="90" />
    <line x1="150" y1="90" x2="120" y2="180" />
    <line x1="120" y1="180" x2="200" y2="210" />
    <line x1="150" y1="90" x2="250" y2="70" />
    
    <!-- Lines connecting nodes (Right Side) -->
    <line x1="770" y1="50" x2="700" y2="90" />
    <line x1="700" y1="90" x2="730" y2="180" />
    <line x1="730" y1="180" x2="650" y2="210" />
    <line x1="700" y1="90" x2="600" y2="70" />
  </g>
  <g fill="#4b5563" opacity="0.6">
    <!-- Left Nodes -->
    <circle cx="80" cy="50" r="3" />
    <circle cx="150" cy="90" r="4" fill="#a78bfa" />
    <circle cx="120" cy="180" r="3" />
    <circle cx="200" cy="210" r="4" fill="#22d3ee" />
    <circle cx="250" cy="70" r="3.5" />
    
    <!-- Right Nodes -->
    <circle cx="770" cy="50" r="3" />
    <circle cx="700" cy="90" r="4" fill="#22d3ee" />
    <circle cx="730" cy="180" r="3" />
    <circle cx="650" cy="210" r="4" fill="#a78bfa" />
    <circle cx="600" cy="70" r="3.5" />
  </g>

  <!-- Stylized Content -->
  <!-- Name -->
  <text x="425" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    SAI CHERANJEEVE S
  </text>
  
  <!-- Role / Subtitle -->
  <text x="425" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'" font-size="16" font-weight="600" fill="url(#violet-cyan)" letter-spacing="3">
    BACKEND ENGINEER • AI/ML SYSTEMS
  </text>

  <!-- Punchy Slogan -->
  <text x="425" y="185" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#9ca3af" letter-spacing="0.5">
    &lt; designing fault-tolerant, scale-ready systems /&gt;
  </text>

  <!-- Glowing Border Accent -->
  <rect x="0.5" y="0.5" width="849" height="259" rx="11.5" fill="none" stroke="#27272a" stroke-width="1" />
</svg>
